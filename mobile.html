<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="TA Command Center mobile experience">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./mobile-manifest.json">
  <title>TA Command Center — Mobile</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#f8fafc; }
    #app-frame { display:block; width:100%; height:100%; border:0; }
    #loading { position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:#f8fafc; font:600 14px Inter,system-ui,sans-serif; color:#475569; }
    #loading.hide { display:none; }
  </style>
</head>
<body>
  <div id="loading">Loading TA Command Center…</div>
  <iframe id="app-frame" src="./index.html" title="TA Command Center"></iframe>
  <script>
    const frame = document.getElementById('app-frame');
    const loading = document.getElementById('loading');
    const mobileCSS = `
      html,body { width:100%!important; max-width:100%!important; overflow-x:hidden!important; }
      .sidebar { width:min(86vw,320px)!important; }
      .main-wrapper { width:100%!important; max-width:100vw!important; margin-left:0!important; }
      .content { width:100%!important; max-width:100%!important; padding-left:.75rem!important; padding-right:.75rem!important; }
      .topbar { padding:.55rem .7rem!important; gap:.45rem!important; }
      .icon-btn,.mobile-menu-btn { min-width:42px!important; min-height:42px!important; }
      .user-info { display:none!important; }
      .search-bar { min-width:0!important; }
      .card,.kpi-card,.job-card { min-width:0!important; max-width:100%!important; }
      .table-wrap { max-width:100%!important; overflow-x:auto!important; -webkit-overflow-scrolling:touch!important; }
      button,.btn-primary,.btn-outline,.btn-ghost,select,input,textarea { min-height:42px; }
      .notif-panel { left:10px!important; right:10px!important; width:auto!important; }
      .chat-panel { width:100vw!important; max-width:100vw!important; }
      @media (max-width:600px) {
        .kpi-row { grid-template-columns:repeat(2,minmax(0,1fr))!important; gap:.65rem!important; }
        .kpi-card { padding:.75rem!important; gap:.55rem!important; }
        .kpi-value { font-size:1.2rem!important; }
        .card { padding:.85rem!important; border-radius:10px!important; }
        .page-header h1 { font-size:1.2rem!important; flex-wrap:wrap; }
        .page-header p { font-size:.78rem!important; }
        .ai-search-box { flex-direction:column!important; }
        .ai-search-box textarea { width:100%!important; min-height:100px!important; }
        .ai-search-box .btn-primary { width:100%!important; justify-content:center!important; }
        .job-card { flex-direction:column!important; }
        .job-actions { width:100%!important; flex-direction:row!important; flex-wrap:wrap!important; }
        .job-actions>* { flex:1 1 120px; }
        .filters-row { flex-wrap:wrap!important; }
        .filters-row>* { flex:1 1 140px; min-width:0; }
      }
      @media (max-width:390px) {
        .kpi-row { grid-template-columns:1fr!important; }
        .content { padding-left:.5rem!important; padding-right:.5rem!important; }
        .topbar-right .btn-outline { display:none!important; }
      }
    `;
    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        const style = doc.createElement('style');
        style.id = 'ta-command-center-mobile-layer';
        style.textContent = mobileCSS;
        doc.head.appendChild(style);
        loading.classList.add('hide');
      } catch (e) {
        loading.textContent = 'TA Command Center loaded';
        setTimeout(() => loading.classList.add('hide'), 400);
      }
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./mobile-sw.js', { scope: './' }).catch(() => {});
    }
  </script>
</body>
</html>
